<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upstream</title>
    <style>
      body {
        margin: 0;
        width: 280px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: system-ui, sans-serif;
      }
      #app {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      p {
        font-size: 12px;
        color: #a3a3a3;
        margin: 0;
      }
      a {
        color: #f97316;
      }
      .timer {
        font-size: 36px;
        font-weight: 600;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        font-size: 12px;
        border-radius: 999px;
        padding: 8px 14px;
        border: 1px solid #404040;
        background: transparent;
        color: #f5f5f5;
        cursor: pointer;
        flex: 1;
      }
      button.primary {
        background: #f97316;
        border-color: #f97316;
        color: #000;
        font-weight: 600;
      }
      button.selected {
        border-color: #f97316;
        color: #f97316;
      }
      .streak {
        font-size: 12px;
        color: #fb923c;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Upstream</h1>
      <p>Loading…</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
