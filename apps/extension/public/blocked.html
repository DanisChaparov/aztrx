<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upstream — blocked</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #070b0a;
        color: #f5f5f5;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        animation: fade-in 0.35s ease-out;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: #5ed29c;
      }
      .badge::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #5ed29c;
        box-shadow: 0 0 8px rgba(94, 210, 156, 0.8);
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
      }
      p {
        color: #a3a3a3;
        max-width: 360px;
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="badge">Upstream — focus session active</div>
    <h1>🔒 You're in a focus session</h1>
    <p id="message">This site is on your blocklist while a session is active. Get back to work — you've got this.</p>
    <script src="blocked.js"></script>
  </body>
</html>
