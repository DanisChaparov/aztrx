<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aztrx</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c10;
        color: #f5f5f5;
        font-family: system-ui, sans-serif;
        overflow: hidden;
        border-radius: 12px;
      }
      #titlebar {
        -webkit-app-region: drag;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        font-size: 12px;
        color: #a3a3a3;
      }
      #close {
        -webkit-app-region: no-drag;
        cursor: pointer;
        border: none;
        background: transparent;
        color: #a3a3a3;
        font-size: 14px;
      }
      #app {
        padding: 0 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        text-align: center;
      }
      .timer {
        font-size: 44px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      button.action {
        font: inherit;
        font-size: 13px;
        border-radius: 999px;
        padding: 10px 16px;
        border: 1px solid #404040;
        background: transparent;
        color: #f5f5f5;
        cursor: pointer;
        flex: 1;
      }
      button.primary {
        background: #6744FF;
        border-color: #6744FF;
        color: #fff;
        font-weight: 600;
      }
      button.selected {
        border-color: #6744FF;
        color: #a996ff;
      }
      .streak {
        font-size: 12px;
        color: #a996ff;
      }
      .mascot-wrap {
        display: flex;
        justify-content: center;
        margin-top: -4px;
      }
      p {
        font-size: 12px;
        color: #a3a3a3;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="titlebar">
      <span>Aztrx</span>
      <button id="close">✕</button>
    </div>
    <div id="app">
      <p>Loading…</p>
    </div>
    <script src="../dist/renderer.js"></script>
  </body>
</html>
